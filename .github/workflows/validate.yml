name: validate

on:
  push:
    branches: [main]
    tags: ["packs-v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifests and index
        run: python3 scripts/validate.py
      - name: No binaries in git
        run: python3 scripts/check-no-large-binaries.py

  verify-release:
    if: startsWith(github.ref, 'refs/tags/packs-v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every index row matches its release asset
        run: python3 scripts/verify-release.py --tag "${GITHUB_REF_NAME}"
